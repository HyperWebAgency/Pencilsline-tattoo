<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!--
    Tileable washi paper on the ivoire chaud base #F3EFE5.
    Two lit noise layers: a broad crumple plus a fine tooth. Diffuse lighting is
    what turns flat noise into relief; diffuseConstant is tuned so the tile's
    mean colour lands back on #F3EFE5 rather than drifting white.
    stitchTiles="stitch" makes the noise repeat without seams.
  -->
  <defs>
    <filter id="crumple" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="600"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="5" seed="11"
                    stitchTiles="stitch" result="n" />
      <feDiffuseLighting in="n" lighting-color="#f3efe5" surfaceScale="1.35" diffuseConstant="1.088">
        <feDistantLight azimuth="58" elevation="68" />
      </feDiffuseLighting>
    </filter>

    <filter id="tooth" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="600"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="23"
                    stitchTiles="stitch" result="n" />
      <feDiffuseLighting in="n" lighting-color="#f3efe5" surfaceScale="0.6" diffuseConstant="1.068">
        <feDistantLight azimuth="58" elevation="70" />
      </feDiffuseLighting>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#f3efe5" />
  <rect width="600" height="600" filter="url(#crumple)" />
  <rect width="600" height="600" filter="url(#tooth)" opacity="0.5" />

  <!-- Sparse inclusions, the little dark flecks in real mulberry paper. -->
  <g fill="#6d5c46">
    <circle cx="118" cy="242" r="1.15" opacity="0.3" />
    <circle cx="447" cy="96" r="0.8" opacity="0.25" />
    <circle cx="322" cy="511" r="1.35" opacity="0.2" />
    <circle cx="551" cy="368" r="0.7" opacity="0.28" />
    <circle cx="76" cy="533" r="0.65" opacity="0.22" />
  </g>
</svg>
